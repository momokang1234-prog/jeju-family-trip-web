        /* Sidebar (Left) */

            flex-direction: column;
            z-index: 100;

        }

        }
        .sidebar-title {

            display: flex;

            border-bottom: 1px solid #E2E8F0;
            overflow-x: auto;

        .day-btn {

            border: 1px solid #CBD5E1;
            background: white;

            font-weight: 700;

        .filter-section {

            border-bottom: 1px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
        }
        .filter-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;

            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag-btn.active {
            background: #0F172A;
            color: white;
            border-color: #0F172A;
        }
        
        #placeList {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        /* Map (Right) */
        #map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }
        #map { width: 100%; height: 100%; }
        
        /* Modal */
        #loginModal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        .modal-card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .login-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #E2E8F0;
            background: #F8FAFC;
            font-size: 15px;
            font-weight: 700;
            color: #1E293B;
            cursor: pointer;
            transition: all 0.2s;
        }
        .login-btn:hover {
            background: #2563EB;
            color: white;
            border-color: #2563EB;
        }

            padding: 2px 6px;
            background: #E2E8F0;
            border-radius: 4px;
            font-size: 11px;
            color: #334155;
            margin-right: 4px;
        }
        
        .step-badge {
            background: #2563EB;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 11px;
            display: inline-block;
        }
        
        /* Custom Drop-shaped Leaflet Pin */
        .custom-pin { background: transparent; border: none; }
        .pin-wrapper {
            position: relative;
            width: 34px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .pin-wrapper:hover {
            transform: translateY(-8px) scale(1.1);
        }
        .pin-body {
            position: relative;
            width: 34px;
            height: 34px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            border: 2px solid white;
            box-shadow: -2px 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pin-icon {
            transform: rotate(45deg);
            font-size: 15px;
            line-height: 1;
        }
        .pin-shadow {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 6px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            filter: blur(2px);
            z-index: -1;
        }

            color: #FFFFFF !important;
            border: 1px solid rgba(255,255,255,0.2) !important;

            if (urlOrClass.startsWith('이미지_')) {
                return window.베이스64_저장소[urlOrClass] || 'https://images.unsplash.com/photo-1596700889269-d40b4bc91238?w=200';
            }
            return urlOrClass;
        }
        
        // No temporary hardcoded itinerary data! Clean empty initial state
        const getStore = (k) => {
            const val = localStorage.getItem(k);
            if (!val) {
                if (k === 'jeju_iti') return { 1: [], 2: [], 3: [] };
                return {};
            }
            try {
                const parsed = JSON.parse(val);
                return parsed;
            } catch(e) {
                return (k === 'jeju_iti') ? { 1: [], 2: [], 3: [] } : {};
            }
        };
        const setStore = (k, v) => localStorage.setItem(k, JSON.stringify(v));
        
        let currentRouteDay = 0;
        let selectedCat = 'ALL';
        let selectedAud = 'ALL';
        let markers = {};
        let routingControl = null;

        // Star / Favorite Toggle function
        function toggleStar(placeId) {
            if (!currentUser) {
                alert('좋아요 기능은 프로필 선택 후 이용할 수 있습니다.');
                document.getElementById('loginModal').style.display = 'flex';
                return;
            }
            const stars = getStore('jeju_stars');
            const list = stars[placeId] || [];
            const idx = list.indexOf(currentUser);
            if (idx >= 0) {
                list.splice(idx, 1);
            } else {
                list.push(currentUser);
            }
            if (list.length === 0) {
                delete stars[placeId];
            } else {
                stars[placeId] = list;
            }
            setStore('jeju_stars', stars);
            renderSidebar();
        }

        // Helper to generate consistent buttons (Map, Naver Map link, Star, Add/Remove Route)
        function getActionButtonsHtml(place, inRouteDay, isCandidate) {
            const placeStars = getStore('jeju_stars')[place.id] || [];
            const isStarred = currentUser && placeStars.includes(currentUser);
            
            const starBtnHtml = `
                <button onclick="event.stopPropagation(); toggleStar(${place.id});" 
                        style="background:${isStarred ? '#FDF2F8' : 'white'}; border:1px solid ${isStarred ? '#EC4899' : '#CBD5E1'}; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:700; color:${isStarred ? '#BE185D' : '#475569'}; cursor:pointer; transition:all 0.15s;">
                    ${isStarred ? '❤️ 좋아요 취소' : '♡ 좋아요'}
                </button>
            `;
            const naverBtnHtml = `
                <a href="https://map.naver.com/p/search/제주%20${encodeURIComponent(place.name)}" target="_blank" onclick="event.stopPropagation();"
                   style="background:#03C75A; color:white; border:none; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:700; text-decoration:none; display:inline-flex; align-items:center; gap:3px;">
                    🗺️ 네이버 지도
                </a>
            `;
            const mapBtnHtml = `
                <button onclick="event.stopPropagation(); map.flyTo([${place.latitude}, ${place.longitude}], 15, {animate:true, duration:1.0}); setTimeout(()=>openPopup(${place.id}),1000);"
                        style="background:white; border:1px solid #CBD5E1; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:700; color:#1E293B; cursor:pointer;">
                    📍 지도 보기
                </button>
            `;
            let routeBtnHtml = '';
            if (currentUser === '작은아들') {
                if (inRouteDay > 0 && !isCandidate) {
                    routeBtnHtml = `
                        <button onclick="event.stopPropagation(); removeFromDayRoute(${inRouteDay}, ${place.id});"
                                style="background:#FEF2F2; border:1px solid #FCA5A5; border-radius:6px; padding:4px 8px; font-size:11px; font-weight:700; color:#EF4444; cursor:pointer;">
                            🗑️ 제외
                        </button>
                    `;
                } else if (inRouteDay > 0 && isCandidate) {
                    routeBtnHtml = `
                        <button onclick="event.stopPropagation(); addToDayRoute(${inRouteDay}, ${place.id});"
                                style="background:#EFF6FF; border:1px solid #93C5FD; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:700; color:#2563EB; cursor:pointer;">
                            + ${inRouteDay}일차 동선에 추가
                        </button>
                    `;
                }
            }
            return `<div style="margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center;">${mapBtnHtml}${naverBtnHtml}${starBtnHtml}${routeBtnHtml}</div>`;
        }

        // Map Init
        const map = L.map('map', { zoomControl: false }).setView([33.38, 126.55], 10);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
        L.control.zoom({ position: 'topright' }).addTo(map);

        function renderMarkers() {
            Object.values(markers).forEach(m => map.removeLayer(m));
            markers = {};

            db.places.forEach(place => {
                if (!place.latitude) return;
                
                // filter check
                if (selectedCat !== 'ALL' && place.category !== selectedCat) return;
                if (selectedAud !== 'ALL' && !(place.audience || []).includes(selectedAud)) return;

                let pinColor = '#3B82F6';
                let pinEmoji = '🗺️';
                if (place.category.includes("식당") || place.category.includes("맛집")) {
                    pinColor = '#F59E0B';
                    pinEmoji = '🍽️';
                } else if (place.category.includes("카페") || place.category.includes("베이커리")) {
                    pinColor = '#D946EF';
                    pinEmoji = '☕';
                } else if (place.category.includes("바") || place.category.includes("주점")) {
                    pinColor = '#8B5CF6';
                    pinEmoji = '🍸';
                } else if (place.category.includes("관광") || place.category.includes("자연") || place.category.includes("오름") || place.category.includes("해변")) {
                    pinColor = '#10B981';
                    pinEmoji = '🌿';
                } else if (place.category.includes("체험") || place.category.includes("액티비티") || place.category.includes("테마")) {
                    pinColor = '#EF4444';
                    pinEmoji = '🎯';
                } else if (place.category.includes("시장") || place.category.includes("쇼핑")) {
                    pinColor = '#F43F5E';
                    pinEmoji = '🛍️';
                } else if (place.category.includes("목장") || place.category.includes("동물")) {
                    pinColor = '#84CC16';
                    pinEmoji = '🐎';
                }
                
                const icon = L.divIcon({
                    className: 'custom-pin',
                    html: `
                        <div class="pin-wrapper">
                            <div class="pin-shadow"></div>
                            <div class="pin-body" style="background:${pinColor};">
                                <div class="pin-icon">${pinEmoji}</div>
                            </div>
                        </div>
                    `,
                    iconSize: [34, 44],
                    iconAnchor: [17, 44]
                });
                
                const imgSrc = getRealImageUrl(place.image_url);
                const descText = place.reason || place.summary || '가족 추천 명소';
                const naverMapUrl = `https://map.naver.com/p/search/제주%20${encodeURIComponent(place.name)}`;

                const marker = L.marker([place.latitude, place.longitude], { icon }).addTo(map);
                marker.bindTooltip(place.name, {
                    permanent: false,
                    direction: 'top',
                    className: 'spot-tooltip',
                    offset: [0, -15]
                });
                marker.bindPopup(`
                    <div style="width:230px;">
                        <img src="${imgSrc}" style="width:100%; height:120px; object-fit:cover; border-radius:8px; margin-bottom:8px;">
                        <div style="font-size:11px; font-weight:700; color:${pinColor};">${place.category}</div>
                        <h3 style="font-size:15px; font-weight:800; color:#0F172A; margin:4px 0;">${place.name}</h3>
                        <p style="font-size:12px; color:#475569; margin:4px 0; line-height:1.4;">${descText}</p>
                        <a href="${naverMapUrl}" target="_blank" style="display:inline-block; margin-top:6px; background:#03C75A; color:white; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; text-decoration:none;">🗺️ 네이버 지도 열기</a>
                    </div>
                `);
                markers[place.id] = marker;
            });
        }

        function flyToSpot(lat, lng, id) {
            if (window.innerWidth <= 768) {
                toggleMobileSidebar(false);
            }
            map.flyTo([lat, lng], 16, { animate: true, duration: 1.0 });
            setTimeout(() => openPopup(id), 1000);
        }

        function toggleMobileSidebar(forceState) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            const btnText = document.getElementById('mobileToggleText');
            if (!sidebar) return;
            const isOpen = forceState !== undefined ? forceState : !sidebar.classList.contains('open');
            if (isOpen) {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('show');
                if (btnText) btnText.innerHTML = '✕ 지도만 보기';
            } else {
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('show');
                if (btnText) btnText.innerHTML = '📋 장소 목록 보기 (' + db.places.length + '곳)';
            }
        }

        map.on('zoomend moveend', function() {
            const currentZoom = map.getZoom();
            const bounds = map.getBounds();
            let visibleMarkers = [];

            db.places.forEach(place => {
                const marker = markers[place.id];
                if (!marker) return;
                
                // 1. Zoom 12 이상에서 이름 툴팁 항상 표시
                if (currentZoom >= 12) {
                    marker.openTooltip();
                } else {
                    marker.closeTooltip();
                }

                // 2. Zoom 15 이상 고배율 확대 시 화면 중앙 인근 마커의 팝업 자동 표시
                if (currentZoom >= 15 && bounds.contains(marker.getLatLng())) {
                    const center = map.getCenter();
                    const dist = marker.getLatLng().distanceTo(center);
                    visibleMarkers.push({ marker, id: place.id, dist });
                }
            });

            if (currentZoom >= 15 && visibleMarkers.length > 0) {
                visibleMarkers.sort((a, b) => a.dist - b.dist);
                if (visibleMarkers[0].dist < 2000) {
                    visibleMarkers[0].marker.openPopup();
                }
            }
        });

        function renderSidebar() {
            const list = document.getElementById('placeList');
            if (!list) return;
            list.innerHTML = '';
            const stars = getStore('jeju_stars');
            const iti = getStore('jeju_iti');

            if (currentRouteDay > 0) {
                // 1일차, 2일차, 3일차 보기 모드
                const dayList = iti[currentRouteDay] || [];
                
                // [섹션 1: 확정 동선 코스]
                const header1 = document.createElement('div');
                header1.style.cssText = "padding: 14px; background: linear-gradient(135deg, #1E3A8A, #3B82F6); color: white; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(37,99,235,0.2);";
                header1.innerHTML = `
                    <div style="font-size: 15px; font-weight: 800; display:flex; align-items:center; justify-content:space-between;">
                        <span>✨ ${currentRouteDay}일차 가족 여행 확정 동선</span>
                        <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:20px; font-size:12px;">${dayList.length}곳 방문</span>
                    </div>
                    <div style="font-size: 12px; margin-top: 4px; opacity: 0.9;">순서대로 방문하는 최적 코스입니다. 카드를 클릭하면 위치로 이동합니다.</div>
                `;
                list.appendChild(header1);

                if (dayList.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.style.cssText = "padding: 20px 16px; text-align: center; color: #64748B; background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 10px; margin-bottom: 16px; font-size: 13px; line-height: 1.5;";
                    emptyDiv.innerHTML = `아직 <b>${currentRouteDay}일차</b>에 등록된 동선이 없습니다.<br>아래 <b>[💡 추천 후보 및 맛집]</b> 리스트에서<br><b>'+ ${currentRouteDay}일차 동선에 추가'</b> 버튼을 눌러 동선을 만들어보세요!`;
                    list.appendChild(emptyDiv);
                } else {
                    dayList.forEach((p, idx) => {
                        const place = db.places.find(x => x.id === p.id);
                        if (!place) return;

                        const placeStars = stars[place.id] || [];
                        const starHtml = placeStars.length > 0 ? `<div class="star-info" style="margin-top:6px; font-size:12px; color:#BE185D; font-weight:700;">❤️ ${placeStars.join(', ')} 좋아요</div>` : '';
                        const pinColor = (place.category.includes("식당")||place.category.includes("카페")) ? '#E67E22' : '#1E293B';
                        const imgSrc = getRealImageUrl(place.image_url);
                        const descText = place.reason || place.summary || '가족 추천 명소';
                        const actionButtons = getActionButtonsHtml(place, currentRouteDay, false);

                        const div = document.createElement('div');
                        div.className = 'place-item';
                        div.style.cssText = "border-left: 5px solid #3B82F6; background: #F8FAFC; margin-bottom: 12px; padding: 12px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; gap: 12px; cursor: pointer; transition: all 0.2s;";
                        
                        div.innerHTML = `
                            <img class="place-img" src="${imgSrc}" style="width:90px; height:90px; border-radius:8px; object-fit:cover; flex-shrink:0;">
                            <div class="place-info" style="flex:1; overflow:hidden;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                                    <span class="step-badge">${idx + 1}️⃣ ${idx + 1}번째 코스</span>
                                    <span style="color:${pinColor}; font-size:12px; font-weight:700;">${place.category}</span>
                                </div>
                                <div class="place-name" style="font-size:15px; font-weight:800; color:#0F172A; margin-bottom:4px;">${place.name}</div>
                                <div class="place-desc" style="font-size:12px; color:#475569; margin-bottom:6px; line-height:1.4; background:#EFF6FF; padding:6px; border-radius:6px;">
                                    💬 <b>추천 이유:</b> ${descText}
                                </div>
                                ${starHtml}
                                ${actionButtons}
                            </div>
                        `;
                        div.onclick = () => flyToSpot(place.latitude, place.longitude, place.id);
                        list.appendChild(div);
                    });
                }

                // [섹션 2: 해당 일차 추가 추천 후보 리스트]
                const inRouteIds = new Set(dayList.map(p => p.id));
                const header2 = document.createElement('div');
                header2.style.cssText = "padding: 12px 14px; background: #F1F5F9; color: #334155; border-radius: 12px; margin: 24px 0 12px 0; font-weight: 800; font-size: 14px; border-left: 4px solid #64748B;";
                header2.innerHTML = `💡 ${currentRouteDay}일차 추천 후보 및 맛집 (${db.places.length - inRouteIds.size}곳) <span style="font-size:11px; font-weight:400;">(클릭하여 동선에 추가 가능)</span>`;
                list.appendChild(header2);

                db.places.forEach(place => {
                    if (!place.latitude || inRouteIds.has(place.id)) return;
                    if (selectedCat !== 'ALL' && place.category !== selectedCat) return;
                    if (selectedAud !== 'ALL' && !(place.audience || []).includes(selectedAud)) return;

                    const placeStars = stars[place.id] || [];
                    const starHtml = placeStars.length > 0 ? `<div class="star-info" style="margin-top:4px; font-size:12px; color:#BE185D; font-weight:700;">❤️ ${placeStars.join(', ')} 좋아요</div>` : '';
                    const pinColor = (place.category.includes("식당")||place.category.includes("카페")) ? '#E67E22' : '#64748B';
                    const imgSrc = getRealImageUrl(place.image_url);
                    const descText = place.reason || place.summary || '가족 추천 명소';
                    const actionButtons = getActionButtonsHtml(place, currentRouteDay, true);

                    const div = document.createElement('div');
                    div.className = 'place-item';
                    div.style.cssText = "background: white; margin-bottom: 10px; padding: 10px; border-radius: 10px; border: 1px solid #E2E8F0; display: flex; gap: 10px; cursor: pointer; opacity: 0.95;";
                    
                    div.innerHTML = `
                        <img class="place-img" src="${imgSrc}" style="width:75px; height:75px; border-radius:8px; object-fit:cover; flex-shrink:0;">
                        <div class="place-info" style="flex:1; overflow:hidden;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                                <span style="color:${pinColor}; font-size:11px; font-weight:700;">${place.category}</span>
                            </div>
                            <div class="place-name" style="font-size:14px; font-weight:700; color:#1E293B; margin-bottom:4px;">${place.name}</div>
                            <div class="place-desc" style="font-size:11px; color:#64748B; margin-bottom:6px; line-height:1.3;">
                                💬 ${descText}
                            </div>
                            ${starHtml}
                            ${actionButtons}
                        </div>
                    `;
                    div.onclick = () => flyToSpot(place.latitude, place.longitude, place.id);
                    list.appendChild(div);
                });

            } else {
                // 전체보기 모드 (0)
                const header0 = document.createElement('div');
                header0.style.cssText = "padding: 14px; background: linear-gradient(135deg, #0F172A, #334155); color: white; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(15,23,42,0.2);";
                header0.innerHTML = `
                    <div style="font-size: 15px; font-weight: 800; display:flex; align-items:center; justify-content:space-between;">
                        <span>✨ ${db.places.length}개 가족 여행 장소 및 맛집 전체 DB</span>
                        <span style="background:rgba(255,255,255,0.2); padding:2px 8px; border-radius:20px; font-size:12px;">${db.places.length}곳</span>
                    </div>
                    <div style="font-size: 12px; margin-top: 4px; opacity: 0.9;">상단의 <b>[1일차] ~ [3일차]</b> 버튼을 클릭하면 일차별 계획 동선 리스트가 왼쪽에 나타납니다.</div>
                `;
                list.appendChild(header0);

                db.places.forEach(place => {
                    if (!place.latitude) return;
                    if (selectedCat !== 'ALL' && place.category !== selectedCat) return;
                    if (selectedAud !== 'ALL' && !(place.audience || []).includes(selectedAud)) return;

                    const placeStars = stars[place.id] || [];
                    const starHtml = placeStars.length > 0 ? `<div class="star-info" style="margin-top:4px; font-size:12px; color:#BE185D; font-weight:700;">❤️ ${placeStars.join(', ')} 좋아요</div>` : '';
                    const pinColor = (place.category.includes("식당")||place.category.includes("카페")) ? '#E67E22' : '#1E293B';
                    const imgSrc = getRealImageUrl(place.image_url);
                    const descText = place.reason || place.summary || '가족 추천 명소';
                    const actionButtons = getActionButtonsHtml(place, 0, false);

                    const div = document.createElement('div');
                    div.className = 'place-item';
                    div.style.cssText = "background: white; margin-bottom: 12px; padding: 12px; border-radius: 10px; border: 1px solid #E2E8F0; display: flex; gap: 12px; cursor: pointer; transition: all 0.2s;";
                    
                    div.innerHTML = `
                        <img class="place-img" src="${imgSrc}" style="width:85px; height:85px; border-radius:8px; object-fit:cover; flex-shrink:0;">
                        <div class="place-info" style="flex:1; overflow:hidden;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                                <span style="color:${pinColor}; font-size:12px; font-weight:700;">${place.category}</span>
                            </div>
                            <div class="place-name" style="font-size:15px; font-weight:800; color:#0F172A; margin-bottom:4px;">${place.name}</div>
                            <div class="place-desc" style="font-size:12px; color:#475569; margin-bottom:6px; line-height:1.4; background:#F8FAFC; padding:6px; border-radius:6px;">
                                💬 <b>추천 이유:</b> ${descText}
                            </div>
                            ${starHtml}
                            ${actionButtons}
                        </div>
                    `;
                        div.onclick = () => flyToSpot(place.latitude, place.longitude, place.id);
                    list.appendChild(div);
                });
            }
        }

        function openPopup(id) {
            if (markers[id]) markers[id].openPopup();
        }

        function addToDayRoute(day, placeId) {
            const iti = getStore('jeju_iti');
            const list = iti[day] || [];
            if (list.some(p => p.id === placeId)) return alert('이미 해당 일차 동선에 추가된 장소입니다.');
            const place = db.places.find(p => p.id === placeId);
            if (!place) return;
            list.push({id: place.id, title: place.name, lat: place.latitude, lng: place.longitude});
            iti[day] = list;
            setStore('jeju_iti', iti);
            renderSidebar();
            showRoute(day);
        }

        function removeFromDayRoute(day, placeId) {
            const iti = getStore('jeju_iti');
            const list = iti[day] || [];
            iti[day] = list.filter(p => p.id !== placeId);
            setStore('jeju_iti', iti);
            renderSidebar();
            showRoute(day);
        }

        function showRoute(day) {
            currentRouteDay = day;
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById('btnDay'+day);
            if (btn) btn.classList.add('active');
            
            if (routingControl) {
                try { map.removeControl(routingControl); } catch(e){}
                routingControl = null;
            }
            
            renderSidebar();
            
            if (day === 0) {
                map.setView([33.38, 126.55], 10);
                return;
            }
            
            const iti = getStore('jeju_iti');
            const dayList = iti[day] || [];
            if (dayList.length < 2) return;
            
            const waypoints = [];
            dayList.forEach(p => {
                const place = db.places.find(x => x.id === p.id);
                if (place && place.latitude) {
                    waypoints.push(L.latLng(place.latitude, place.longitude));
                }
            });
            
            if (waypoints.length >= 2) {
                routingControl = L.Routing.control({
                    waypoints: waypoints,
                    router: L.Routing.osrmv1({
                        serviceUrl: 'https://router.project-osrm.org/route/v1'
                    }),
                    lineOptions: {
                        styles: [{color: '#2563EB', opacity: 0.85, weight: 6}]
                    },
                    addWaypoints: false,
                    draggableWaypoints: false,
                    fitSelectedRoutes: true,
                    show: false,
                    createMarker: function() { return null; }
                }).addTo(map);
            }
        }

        function filterCat(cat, btn) {
            selectedCat = cat;
            document.querySelectorAll('#catFilters .tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMarkers();
            renderSidebar();
        }
        
        function filterAud(aud, btn) {
            selectedAud = aud;
            document.querySelectorAll('#audFilters .tag-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMarkers();
            renderSidebar();
        }

        function login(user) {
            currentUser = user;
            localStorage.setItem('jeju_user', user);
            initAuth();
        }
        
        function logout() {
            currentUser = null;
            localStorage.removeItem('jeju_user');
            initAuth();
        }

        function initAuth() {
            renderMarkers();
            showRoute(0);
            if (!currentUser) {
                document.getElementById('loginModal').style.display = 'flex';
            } else {
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('authArea').innerHTML = `
                    <span class="user-badge" style="background:#F1F5F9; color:#1E293B; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700;">
                        👤 ${currentUser} 접속중
                    </span>
                    <button class="logout-btn" onclick="logout()" style="background:#EF4444; color:white; border:none; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer;">
                        로그아웃
                    </button>
                `;
            }
        }

        // Initial Load
        initAuth();
    </script>
    
    <!-- Base64 Storage -->
    <script>
        window.베이스64_저장소 = {};
    </script>
</body>
</html>
